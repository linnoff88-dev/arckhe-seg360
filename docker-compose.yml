services:
  postgres:
    image: postgres:16-alpine
    container_name: seg360-postgres
    environment:
      POSTGRES_USER: seg360
      POSTGRES_PASSWORD: seg360
      POSTGRES_DB: seg360
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seg360']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seg360-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
